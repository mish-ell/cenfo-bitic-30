    <section class="contact-info py-5">
        <div class="container text-center">
            <h2 class="text-primary">Dejanos tu correo electronico</h2>  
    <form method="post" action="/submit-form" class="d-flex flex-column align-items-center">
        <div class="col-12">
            <div class="pt-3 d-flex justify-content-center">
                <div class="text-center">
                    <label for="subscription-email" class="form-label">Correo Electrónico:</label>
                    <input type="email" id="subscription-email" class="form-control w-100" style="max-width: 400px;" placeholder="Escriba su correo electrónico" required>

            </div>
        </div>

        <div class="pt-5"></div>

            <input type="submit" value="Suscribirse" class="btn btn-primary">
        </div>
    </form>

<section class="clip-divider"></section>


    <section class="contact-form py-5">
        <div class="container">
            <h2 class="text-primary text-center">Envía tus preguntas</h2>
            <form method="post" action="/send-question" class="row g-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Escribe tu nombre" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Escribe tu correo electrónico" required>
                </div>
                <div class="col-12">
                    <label for="message" class="form-label">Mensaje</label>
                    <textarea id="message" name="message" class="form-control" rows="5" placeholder="Escribe tu mensaje" required></textarea>
                </div>
                <div class="col-12 text-center">
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </div>
            </form>
        </div>
    </section>
